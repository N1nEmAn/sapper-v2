<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sapper 控制台</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --line:#e3e2dd; --text:#2c2c2a;
    --muted:#6b6a64; --accent:#185fa5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;font-weight:500;margin:0}
  header .stat{color:var(--muted);font-size:12px}
  header .stat b{color:var(--text);font-weight:500}
  nav.tabs{display:flex;gap:2px;margin-left:auto}
  nav.tabs button{font:inherit;font-size:12px;padding:4px 12px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
  nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #wrap{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 50px)}
  #graph{position:relative}
  svg{width:100%;height:100%;display:block}
  aside{background:var(--panel);border-left:1px solid var(--line);
        overflow-y:auto;padding:12px}
  aside h2{font-size:12px;font-weight:500;color:var(--muted);
           margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  aside h2:first-child{margin-top:0}
  .ev{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
  .ev .t{color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .ev .k{color:var(--accent)}
  #tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);
       border-radius:6px;padding:8px 10px;font-size:12px;max-width:280px;
       box-shadow:0 2px 8px rgba(0,0,0,.08);display:none;z-index:10}
  #tip .id{font-family:ui-monospace,monospace;color:var(--muted)}
  #tip .desc{margin-top:4px}
  #tip .appr{margin-top:6px;font-size:11px;color:#3b6d11}
  .appr-btn{margin-top:8px;padding:4px 10px;font-size:12px;cursor:pointer;
            background:#eaf3de;border:1px solid #639922;border-radius:5px;color:#27500a}
  .appr-btn:hover{background:#c0dd97}
  .link{stroke:#c9c7c0;stroke-width:1}
  .node text{font-size:10px;fill:#444;pointer-events:none}
  .legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);
          border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>sapper 控制台</h1>
  <span class="stat" id="s1">facts <b>0</b></span>
  <span class="stat" id="s2">intents <b>0</b></span>
  <span class="stat" id="s3">open <b>0</b></span>
  <span class="stat" id="s4">seq <b>0</b></span>
  <nav class="tabs">
    <button data-mode="graph" class="on">任务图</button>
    <button data-mode="assets">资产图</button>
  </nav>
</header>
<div id="wrap">
  <div id="graph">
    <svg id="svg"></svg>
    <div id="tip"></div>
    <div class="legend" id="legend"></div>
    <div id="empty">等待数据…</div>
  </div>
  <aside>
    <h2>事件流</h2>
    <div id="events"></div>
  </aside>
</div>

<script>
const KIND_COLOR = {
  host:"#185fa5", service:"#0f6e56", vuln:"#a32d2d",
  cred:"#854f0b", loot:"#534ab7", flag:"#993556", note:"#5f5e5a"
};
const ASSET_COLOR = {
  ip:"#185fa5", domain:"#3b8fd6", service:"#0f6e56", vuln:"#a32d2d",
  cred:"#854f0b", loot:"#534ab7", endpoint:"#7a6f5d"
};
let lastSeq = 0, nodes = [], links = [], sim = null, svg, g, linkSel, nodeSel;
let mode = "graph", assetTimer = null;

function initGraph() {
  svg = d3.select("#svg");
  const zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
  svg.call(zoom);
  g = svg.append("g");
  linkSel = g.append("g").attr("class","links");
  nodeSel = g.append("g").attr("class","nodes");
}

function build(data) {
  const facts = data.facts || [], intents = data.intents || [];
  nodes = [];
  const byId = new Map();

  facts.forEach(f => {
    const n = {id:f.id, type:"fact", label:f.title || f.description.slice(0,18),
               kind:f.kind || "note", desc:f.description, raw:f};
    nodes.push(n); byId.set(f.id, n);
  });
  intents.forEach(i => {
    const n = {id:i.id, type:"intent", label:i.title || i.description.slice(0,18),
               status:i.status, desc:i.description, raw:i};
    nodes.push(n); byId.set(i.id, n);
  });

  links = [];
  intents.forEach(i => {
    (i.from || []).forEach(fid => {
      if (byId.has(fid)) links.push({source:fid, target:i.id});
    });
    if (i.to && byId.has(i.to)) links.push({source:i.id, target:i.to});
  });

  document.querySelector("#empty").style.display = nodes.length ? "none" : "flex";
  render();
  layoutLegend();
  updateStats(data.stats);
}

function buildAssets(data) {
  nodes = []; links = [];
  const list = data.assets || [];
  const byKey = new Map();
  list.forEach(a => {
    const n = {id:a.key, type:"asset", atype:a.type, label:a.value,
               desc:a.value, raw:a, seen:a.seen || 1,
               data:a.data || {}, parent:a.parent};
    nodes.push(n); byKey.set(a.key, n);
  });
  (data.edges || []).forEach(e => {
    if (byKey.has(e.source) && byKey.has(e.target))
      links.push({source:e.source, target:e.target});
  });
  document.querySelector("#empty").style.display = nodes.length ? "none" : "flex";
  document.querySelector("#empty").textContent =
    data.available === false ? "资产库为空（记录 fact 后会自动沉淀）" : "等待数据…";
  render();
  layoutLegend();
  const st = data.stats || {total:0, by_type:{}};
  document.querySelector("#s1").innerHTML = `assets <b>${st.total || 0}</b>`;
  document.querySelector("#s2").innerHTML = `types <b>${Object.keys(st.by_type || {}).length}</b>`;
  document.querySelector("#s3").innerHTML = `edges <b>${links.length}</b>`;
  document.querySelector("#s4").innerHTML = `跨任务 <b>${st.first_seen ? st.first_seen.slice(0,10) : "-"}</b>`;
}

function render() {
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(90).strength(.55))
    .force("charge", d3.forceManyBody().strength(-320))
    .force("center", d3.forceCenter(svg.node().clientWidth/2, svg.node().clientHeight/2))
    .force("collide", d3.forceCollide(28));

  linkSel.selectAll("*").remove();
  nodeSel.selectAll("*").remove();

  const l = linkSel.selectAll("line").data(links).join("line").attr("class","link");

  const n = nodeSel.selectAll("g").data(nodes).join("g")
    .attr("class","node").call(drag(sim));

  n.each(function(d) {
    const el = d3.select(this);
    if (d.type === "fact") {
      el.append("circle")
        .attr("r", 9)
        .attr("fill", KIND_COLOR[d.kind] || "#888")
        .attr("stroke", "#fff").attr("stroke-width", 1.5);
    } else if (d.type === "asset") {
      el.append("circle")
        .attr("r", 8 + Math.min(d.seen || 1, 6))
        .attr("fill", ASSET_COLOR[d.atype] || "#888")
        .attr("fill-opacity", .85)
        .attr("stroke", "#fff").attr("stroke-width", 1.5);
    } else {
      el.append("rect")
        .attr("x", -8).attr("y", -8).attr("width", 16).attr("height", 16).attr("rx", 3)
        .attr("fill", d.status === "done" ? "#97c459" : "#d3d1c7")
        .attr("stroke", d.status === "done" ? "#3b6d11" : "#888780")
        .attr("stroke-width", 1.2);
    }
    el.append("text").attr("dy", 22).attr("text-anchor","middle")
      .text(d.type === "asset" ? String(d.label).slice(0, 26) : d.label);
  });

  n.on("mouseover", (e,d) => showTip(e,d)).on("mousemove", moveTip).on("mouseout", hideTip);

  sim.on("tick", () => {
    l.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
     .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    n.attr("transform", d => `translate(${d.x},${d.y})`);
  });
}

function drag(sim) {
  return d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; });
}

const tip = document.querySelector("#tip");
function showTip(e,d) {
  let extra = "";
  if (d.type === "asset") {
    const kv = Object.entries(d.data || {}).slice(0, 4)
      .map(([k,v]) => `${escapeHtml(k)}=${escapeHtml(String(v))}`).join("  ");
    tip.innerHTML = `<div class="id">${escapeHtml(d.id)}</div>
      <div class="desc">${escapeHtml(d.atype)} · 观察 ${d.seen} 次</div>
      ${kv ? `<div class="desc">${kv}</div>` : ""}
      <div class="appr ok">最近 ${escapeHtml(String((d.raw||{}).last_seen || ""))}</div>`;
    tip.style.display = "block";
    return;
  }
  if (d.type === "intent" && d.raw && d.raw.requires_confirmation) {
    extra = d.raw.confirmed_at
      ? `<div class="appr ok">已确认 ${d.raw.confirmed_at.slice(11,19)}</div>`
      : `<button class="appr-btn" onclick="confirmIntent('${d.id}')">批准派发</button>`;
  }
  tip.innerHTML = `<div class="id">${d.id} · ${d.type}${d.kind?" · "+d.kind:""}${
    d.status?" · "+d.status:""}</div><div class="desc">${escapeHtml(d.desc)}</div>${extra}`;
  tip.style.display = "block";
}

async function confirmIntent(id) {
  try {
    const r = await fetch(`/api/confirm/${id}`, {method:"POST"});
    const d = await r.json();
    if (d.ok) { hideTip(); await loadGraph(); }
    else { alert("确认失败: " + (d.error || "unknown")); }
  } catch (e) { alert("确认失败: " + e); }
}
function moveTip(e) {
  tip.style.left = (e.offsetX + 14) + "px";
  tip.style.top  = (e.offsetY + 14) + "px";
}
function hideTip(){ tip.style.display = "none"; }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function layoutLegend() {
  const map = mode === "assets" ? ASSET_COLOR : KIND_COLOR;
  document.querySelector("#legend").innerHTML = Object.entries(map)
    .map(([k,c]) => `<div><i style="background:${c}"></i>${k}</div>`).join("");
}

function updateStats(s) {
  if (!s) return;
  document.querySelector("#s1").innerHTML = `facts <b>${s.facts || 0}</b>`;
  document.querySelector("#s2").innerHTML = `intents <b>${s.intents || 0}</b>`;
  document.querySelector("#s3").innerHTML = `open <b>${s.open || 0}</b>`;
}
function setSeq(n){ document.querySelector("#s4").innerHTML = `seq <b>${n}</b>`; }

function pushEvents(list) {
  const box = document.querySelector("#events");
  list.slice().reverse().forEach(ev => {
    const div = document.createElement("div");
    div.className = "ev";
    div.innerHTML = `<span class="t">${ev.ts.slice(11,19)}</span> <span class="k">${ev.event}</span>`;
    box.prepend(div);
  });
  while (box.children.length > 60) box.lastChild.remove();
}

async function loadGraph() {
  try {
    const r = await fetch("/api/graph");
    build(await r.json());
  } catch (e) { console.error("graph:", e); }
}

async function loadAssets() {
  try {
    const r = await fetch("/api/assets");
    buildAssets(await r.json());
  } catch (e) { console.error("assets:", e); }
}

function setMode(next) {
  if (mode === next) return;
  mode = next;
  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === next));
  document.querySelector("#empty").textContent = "等待数据…";
  if (next === "assets") loadAssets(); else loadGraph();
}

document.querySelectorAll("nav.tabs button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));

async function poll() {
  if (mode === "assets") {
    assetTimer = (assetTimer + 1) % 3;
    if (assetTimer === 0) await loadAssets();   // 每 3 轮（~6s）刷新一次
  } else {
    try {
      const r = await fetch(`/api/events?since=${lastSeq}`);
      const d = await r.json();
      if (d.events && d.events.length) {
        pushEvents(d.events);
        lastSeq = d.last;
        setSeq(lastSeq);
        await loadGraph();
      } else if (d.last) { setSeq(d.last); }
    } catch (e) { /* server restarting */ }
  }
  setTimeout(poll, 2000);
}

initGraph();
loadGraph().then(() => setTimeout(poll, 1500));
window.addEventListener("resize", () => { if (sim) sim.force("center",
  d3.forceCenter(svg.node().clientWidth/2, svg.node().clientHeight/2)).alpha(.3).restart(); });
</script>
</body>
</html>
