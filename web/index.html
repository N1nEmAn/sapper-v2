<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sapper 控制台</title>
<!-- vendored: cdn.jsdelivr.net is unreachable from many CN networks -->
<script src="/vendor/d3.min.js"></script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
  <h1>sapper 控制台</h1>
  <span class="stat" id="s1">facts <b>0</b></span>
  <span class="stat" id="s2">intents <b>0</b></span>
  <span class="stat" id="s3">open <b>0</b></span>
  <span class="stat" id="s4">seq <b>0</b></span>
  <nav class="tabs">
    <button data-mode="graph" class="on">任务图</button>
    <button data-mode="assets">资产图</button>
    <button data-mode="armory">武器库</button>
    <button data-mode="plan">计划</button>
    <button data-mode="traffic">流量</button>
    <button data-mode="chat">对话</button>
  </nav>
</header>

<div id="bar">
  <input id="q" type="search" placeholder="搜索 fact / intent / 资产 / 流量…" autocomplete="off">
  <button id="btn-fact" disabled>＋ 事实</button>
  <button id="btn-intent" disabled>＋ 意图</button>
  <button id="btn-refresh">刷新</button>
  <span id="wmode" class="ro">只读 · 加 --allow-write 启动才能操作</span>
</div>
<div id="results"></div>

<div id="asset-tools">
  <div id="asset-chips" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  <span class="sep"></span>
  <input id="asset-q" placeholder="过滤资产…">
  <button class="act" id="asset-layout">布局：力导向</button>
  <button class="act" id="asset-fit">适配</button>
  <button class="act" id="asset-clear">清筛选</button>
  <span id="asset-meta"></span>
</div>

<div id="wrap">
  <div id="graph">
    <svg id="svg"></svg>
    <div id="tip"></div>

    <div class="legend" id="legend"></div>
    <div id="empty">等待数据…</div>

    <div id="plan">
      <div id="plan-tools"></div>
      <div id="plan-list"></div>
    </div>

    <div id="armory">
      <div id="armory-tools"></div>
      <div id="armory-out"></div>
      <div id="armory-list"></div>
    </div>

    <div id="traffic">
      <div id="tstats"></div>
      <table id="ttable">
        <thead><tr><th>状态</th><th>方法</th><th>URL</th><th>大小</th><th>标记</th></tr></thead>
        <tbody></tbody>
      </table>
      <pre id="tdetail"></pre>
    </div>

    <div id="chat">
      <div id="chatlog"></div>
      <div id="chatstatus"></div>
      <div id="chatbar">
        <textarea id="chatinput" placeholder="让它读图、建事实、派意图…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="act pri" id="chatsend">发送</button>
        <button class="act" id="chatreset">清空</button>
      </div>
    </div>
  </div>

  <aside>
    <div id="detail"><div class="hint">点节点或搜索查看详情</div></div>
    <h2>事件流</h2>
    <div id="events"></div>
  </aside>
</div>

<div id="toast"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
