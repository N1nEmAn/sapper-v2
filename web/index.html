<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sapper 控制台</title>
<!-- vendored: cdn.jsdelivr.net is unreachable from many CN networks, and a
     blank console is worse than a 280 KB file in the repo. -->
<script src="/vendor/d3.min.js"></script>
<style>
  :root{
    --bg:#f7f7f5; --panel:#fff; --line:#e3e2dd; --text:#2c2c2a;
    --muted:#6b6a64; --accent:#185fa5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;padding:14px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;font-weight:500;margin:0}
  header .stat{color:var(--muted);font-size:12px}
  header .stat b{color:var(--text);font-weight:500}
  nav.tabs{display:flex;gap:2px;margin-left:auto}
  nav.tabs button{font:inherit;font-size:12px;padding:4px 12px;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
  nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #wrap{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 94px)}
  #bar{display:flex;align-items:center;gap:8px;padding:6px 20px;
       background:var(--panel);border-bottom:1px solid var(--line);height:44px}
  #bar input[type=search]{flex:0 0 260px;font:inherit;font-size:12px;padding:5px 9px;
       border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
  #bar button{font:inherit;font-size:12px;padding:5px 11px;cursor:pointer;
       background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--text)}
  #bar button:hover{border-color:var(--accent);color:var(--accent)}
  #bar button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
  #wmode{margin-left:auto;font-size:11px;color:var(--muted)}
  #wmode b{color:#3b6d11}
  #wmode.ro b{color:#a32d2d}
  #results{position:absolute;top:94px;left:20px;width:480px;max-height:60vh;overflow:auto;
       background:var(--panel);border:1px solid var(--line);border-radius:6px;
       box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:20;display:none;font-size:12px}
  #results .grp{padding:6px 10px 2px;color:var(--muted);font-size:11px}
  #results .it{padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
  #results .it:hover{background:var(--bg)}
  #results .it .id{font-family:ui-monospace,monospace;color:var(--muted);margin-right:6px}
  #detail{padding-bottom:10px}
  #detail .dtitle{font-size:13px;font-weight:500;margin:2px 0 6px}
  #detail .mrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
  #detail .kv{color:var(--muted);font-size:11.5px;margin:2px 0}
  #detail .kv code{color:var(--text)}
  .act{font:inherit;font-size:11.5px;padding:4px 9px;cursor:pointer;border-radius:5px;
       background:var(--bg);border:1px solid var(--line);color:var(--text)}
  .act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.danger{color:#a32d2d;border-color:#e8b4b4}
  .act:disabled{opacity:.45;cursor:not-allowed}
  .form{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .form label{display:block;font-size:11px;color:var(--muted);margin:6px 0 2px}
  .form input,.form select,.form textarea{width:100%;font:inherit;font-size:12px;
       padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
  .form textarea{min-height:56px;resize:vertical;font-family:inherit}
  #runlog{margin-top:8px;background:#1f1f1d;color:#e6e5df;border-radius:5px;padding:8px;
       font-size:10.5px;line-height:1.45;max-height:220px;overflow:auto;white-space:pre-wrap;display:none}
  #from-box{max-height:140px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);
       border-radius:4px;padding:4px 6px;background:#fff}
  #from-box label{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--text);
       padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  #from-box input{width:auto;flex:0 0 auto}
  .node.sel circle{stroke:#185fa5;stroke-width:3px}
  #graph{position:relative}
  svg{width:100%;height:100%;display:block}
  aside{background:var(--panel);border-left:1px solid var(--line);
        overflow-y:auto;padding:12px}
  aside h2{font-size:12px;font-weight:500;color:var(--muted);
           margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  aside h2:first-child{margin-top:0}
  .ev{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
  .ev .t{color:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .ev .k{color:var(--accent)}
  #tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);
       border-radius:6px;padding:8px 10px;font-size:12px;max-width:280px;
       box-shadow:0 2px 8px rgba(0,0,0,.08);display:none;z-index:10}
  #tip .id{font-family:ui-monospace,monospace;color:var(--muted)}
  #tip .desc{margin-top:4px}
  #tip .appr{margin-top:6px;font-size:11px;color:#3b6d11}
  .appr-btn{margin-top:8px;padding:4px 10px;font-size:12px;cursor:pointer;
            background:#eaf3de;border:1px solid #639922;border-radius:5px;color:#27500a}
  .appr-btn:hover{background:#c0dd97}
  .link{stroke:#c9c7c0;stroke-width:1}
  .node text{font-size:10px;fill:#444;pointer-events:none}
  .legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);
          border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         color:var(--muted);font-size:13px}
  #traffic{position:absolute;inset:0;background:var(--bg);overflow:auto;
           padding:10px 12px;display:none;font-size:12px}
  #tstats{color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;width:100%;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
  th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;
     color:var(--muted);border-bottom:1px solid var(--line);padding:5px 8px}
  td{border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fff}
  td.s2{color:#0f6e56} td.s3{color:#185fa5} td.s4,td.s5{color:#a32d2d;font-weight:500}
  #tdetail{margin-top:10px;background:var(--panel);border:1px solid var(--line);
           border-radius:6px;padding:10px;white-space:pre-wrap;font-size:11px;display:none;
           max-height:46vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>sapper 控制台</h1>
  <span class="stat" id="s1">facts <b>0</b></span>
  <span class="stat" id="s2">intents <b>0</b></span>
  <span class="stat" id="s3">open <b>0</b></span>
  <span class="stat" id="s4">seq <b>0</b></span>
  <nav class="tabs">
    <button data-mode="graph" class="on">任务图</button>
    <button data-mode="assets">资产图</button>
    <button data-mode="traffic">流量</button>
  </nav>
</header>
<div id="bar">
  <input id="q" type="search" placeholder="搜索 fact / intent / 资产 / 流量…" autocomplete="off">
  <button id="btn-fact" disabled>＋ 事实</button>
  <button id="btn-intent" disabled>＋ 意图</button>
  <button id="btn-refresh">刷新</button>
  <span id="wmode" class="ro">只读 · 用 --allow-write 启动可操作</span>
</div>
<div id="results"></div>
<div id="wrap">
  <div id="graph">
    <svg id="svg"></svg>
    <div id="tip"></div>
    <div class="legend" id="legend"></div>
    <div id="empty">等待数据…</div>
    <div id="traffic">
      <div id="tstats"></div>
      <table id="ttable">
        <thead><tr><th>状态</th><th>方法</th><th>URL</th><th>大小</th><th>标记</th></tr></thead>
        <tbody></tbody>
      </table>
      <pre id="tdetail"></pre>
    </div>
  </div>
  <aside>
    <div id="detail"></div>
    <h2>事件流</h2>
    <div id="events"></div>
  </aside>
</div>

<script>
const KIND_COLOR = {
  host:"#185fa5", service:"#0f6e56", vuln:"#a32d2d",
  cred:"#854f0b", loot:"#534ab7", flag:"#993556", note:"#5f5e5a"
};
const ASSET_COLOR = {
  ip:"#185fa5", domain:"#3b8fd6", service:"#0f6e56", vuln:"#a32d2d",
  cred:"#854f0b", loot:"#534ab7", endpoint:"#7a6f5d"
};
let lastSeq = 0, nodes = [], links = [], sim = null, svg, g, linkSel, nodeSel;
let mode = "graph", assetTimer = null;
let graphData = {facts: [], intents: [], stats: {}};
let selectedId = null, writeMode = false, runTimer = null;

function initGraph() {
  svg = d3.select("#svg");
  const zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
  svg.call(zoom);
  g = svg.append("g");
  linkSel = g.append("g").attr("class","links");
  nodeSel = g.append("g").attr("class","nodes");
}

function build(data) {
  const facts = data.facts || [], intents = data.intents || [];
  graphData = data;
  nodes = [];
  const byId = new Map();

  facts.forEach(f => {
    const n = {id:f.id, type:"fact", label:f.title || f.description.slice(0,18),
               kind:f.kind || "note", desc:f.description, raw:f};
    nodes.push(n); byId.set(f.id, n);
  });
  intents.forEach(i => {
    const n = {id:i.id, type:"intent", label:i.title || i.description.slice(0,18),
               status:i.status, desc:i.description, raw:i};
    nodes.push(n); byId.set(i.id, n);
  });

  links = [];
  intents.forEach(i => {
    (i.from || []).forEach(fid => {
      if (byId.has(fid)) links.push({source:fid, target:i.id});
    });
    if (i.to && byId.has(i.to)) links.push({source:i.id, target:i.to});
  });

  document.querySelector("#empty").style.display = nodes.length ? "none" : "flex";
  render();
  layoutLegend();
  updateStats(data.stats);
  if (selectedId) renderDetail(false);
}

function buildAssets(data) {
  nodes = []; links = [];
  const list = data.assets || [];
  const byKey = new Map();
  list.forEach(a => {
    const n = {id:a.key, type:"asset", atype:a.type, label:a.value,
               desc:a.value, raw:a, seen:a.seen || 1,
               data:a.data || {}, parent:a.parent};
    nodes.push(n); byKey.set(a.key, n);
  });
  (data.edges || []).forEach(e => {
    if (byKey.has(e.source) && byKey.has(e.target))
      links.push({source:e.source, target:e.target});
  });
  document.querySelector("#empty").style.display = nodes.length ? "none" : "flex";
  document.querySelector("#empty").textContent =
    data.available === false ? "资产库为空（记录 fact 后会自动沉淀）" : "等待数据…";
  render();
  layoutLegend();
  const st = data.stats || {total:0, by_type:{}};
  document.querySelector("#s1").innerHTML = `assets <b>${st.total || 0}</b>`;
  document.querySelector("#s2").innerHTML = `types <b>${Object.keys(st.by_type || {}).length}</b>`;
  document.querySelector("#s3").innerHTML = `edges <b>${links.length}</b>`;
  document.querySelector("#s4").innerHTML = `跨任务 <b>${st.first_seen ? st.first_seen.slice(0,10) : "-"}</b>`;
}

function render() {
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(90).strength(.55))
    .force("charge", d3.forceManyBody().strength(-320))
    .force("center", d3.forceCenter(svg.node().clientWidth/2, svg.node().clientHeight/2))
    .force("collide", d3.forceCollide(28));

  linkSel.selectAll("*").remove();
  nodeSel.selectAll("*").remove();

  const l = linkSel.selectAll("line").data(links).join("line").attr("class","link");

  const n = nodeSel.selectAll("g").data(nodes).join("g")
    .attr("class","node").call(drag(sim));

  n.each(function(d) {
    const el = d3.select(this);
    if (d.type === "fact") {
      el.append("circle")
        .attr("r", 9)
        .attr("fill", KIND_COLOR[d.kind] || "#888")
        .attr("stroke", "#fff").attr("stroke-width", 1.5);
    } else if (d.type === "asset") {
      el.append("circle")
        .attr("r", 8 + Math.min(d.seen || 1, 6))
        .attr("fill", ASSET_COLOR[d.atype] || "#888")
        .attr("fill-opacity", .85)
        .attr("stroke", "#fff").attr("stroke-width", 1.5);
    } else {
      el.append("rect")
        .attr("x", -8).attr("y", -8).attr("width", 16).attr("height", 16).attr("rx", 3)
        .attr("fill", d.status === "done" ? "#97c459" : "#d3d1c7")
        .attr("stroke", d.status === "done" ? "#3b6d11" : "#888780")
        .attr("stroke-width", 1.2);
    }
    el.append("text").attr("dy", 22).attr("text-anchor","middle")
      .text(d.type === "asset" ? String(d.label).slice(0, 26) : d.label);
  });

  n.on("mouseover", (e,d) => showTip(e,d)).on("mousemove", moveTip)
   .on("mouseout", hideTip)
   .on("click", (e,d) => { e.stopPropagation(); selectNode(d); });

  n.classed("sel", d => d.id === selectedId);

  sim.on("tick", () => {
    l.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
     .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    n.attr("transform", d => `translate(${d.x},${d.y})`);
  });
}

function drag(sim) {
  return d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; });
}

const tip = document.querySelector("#tip");
function showTip(e,d) {
  let extra = "";
  if (d.type === "asset") {
    const kv = Object.entries(d.data || {}).slice(0, 4)
      .map(([k,v]) => `${escapeHtml(k)}=${escapeHtml(String(v))}`).join("  ");
    tip.innerHTML = `<div class="id">${escapeHtml(d.id)}</div>
      <div class="desc">${escapeHtml(d.atype)} · 观察 ${d.seen} 次</div>
      ${kv ? `<div class="desc">${kv}</div>` : ""}
      <div class="appr ok">最近 ${escapeHtml(String((d.raw||{}).last_seen || ""))}</div>`;
    tip.style.display = "block";
    return;
  }
  if (d.type === "intent" && d.raw && d.raw.requires_confirmation) {
    extra = d.raw.confirmed_at
      ? `<div class="appr ok">已确认 ${d.raw.confirmed_at.slice(11,19)}</div>`
      : `<button class="appr-btn" onclick="confirmIntent('${d.id}')">批准派发</button>`;
  }
  tip.innerHTML = `<div class="id">${d.id} · ${d.type}${d.kind?" · "+d.kind:""}${
    d.status?" · "+d.status:""}</div><div class="desc">${escapeHtml(d.desc)}</div>${extra}`;
  tip.style.display = "block";
}

async function confirmIntent(id) {
  try {
    const r = await fetch(`/api/confirm/${id}`, {method:"POST"});
    const d = await r.json();
    if (d.ok) { hideTip(); await loadGraph(); }
    else { alert("确认失败: " + (d.error || "unknown")); }
  } catch (e) { alert("确认失败: " + e); }
}
function moveTip(e) {
  tip.style.left = (e.offsetX + 14) + "px";
  tip.style.top  = (e.offsetY + 14) + "px";
}
function hideTip(){ tip.style.display = "none"; }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function layoutLegend() {
  const map = mode === "assets" ? ASSET_COLOR : KIND_COLOR;
  document.querySelector("#legend").innerHTML = Object.entries(map)
    .map(([k,c]) => `<div><i style="background:${c}"></i>${k}</div>`).join("");
}

function updateStats(s) {
  if (!s) return;
  document.querySelector("#s1").innerHTML = `facts <b>${s.facts || 0}</b>`;
  document.querySelector("#s2").innerHTML = `intents <b>${s.intents || 0}</b>`;
  document.querySelector("#s3").innerHTML = `open <b>${s.open || 0}</b>`;
}
function setSeq(n){ document.querySelector("#s4").innerHTML = `seq <b>${n}</b>`; }

function pushEvents(list) {
  const box = document.querySelector("#events");
  list.slice().reverse().forEach(ev => {
    const div = document.createElement("div");
    div.className = "ev";
    div.innerHTML = `<span class="t">${ev.ts.slice(11,19)}</span> <span class="k">${ev.event}</span>`;
    box.prepend(div);
  });
  while (box.children.length > 60) box.lastChild.remove();
}

// ------------------------------------------------------------------ //
// write ops (requires `sapper serve --allow-write`)
// ------------------------------------------------------------------ //
async function postJSON(path, body) {
  const r = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {}),
  });
  let d = {};
  try { d = await r.json(); } catch (e) { /* empty body */ }
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

const $ = s => document.querySelector(s);
function nodeById(id) { return nodes.find(n => n.id === id); }

function selectNode(d) {
  selectedId = d.id;
  nodeSel.selectAll("g").classed("sel", x => x.id === selectedId);
  renderDetail(true);
}

function clearSelection() {
  selectedId = null;
  nodeSel.selectAll("g").classed("sel", false);
  renderDetail(true);
}

function kvRows(data) {
  return Object.entries(data || {})
    .map(([k, v]) => `<div class="kv"><code>${escapeHtml(k)}</code> = ${escapeHtml(String(v))}</div>`)
    .join("");
}

function renderDetail(force) {
  const box = $("#detail");
  if (!selectedId) { box.innerHTML = `<div class="kv">点节点或搜结果查看详情</div>`; return; }
  if (!force && box.querySelector(".form")) return;   // don't clobber a form being filled
  const node = nodeById(selectedId);

  if (!node) {
    // asset / traffic pseudo-nodes resolved from search results
    const pseudo = window.__pseudo && window.__pseudo[selectedId];
    if (!pseudo) { box.innerHTML = `<div class="kv">${escapeHtml(selectedId)}</div>`; return; }
    box.innerHTML = `<div class="dtitle">${escapeHtml(pseudo.label || pseudo.id)}</div>
      <div class="kv">${escapeHtml(pseudo.id)}</div>${kvRows(pseudo.data)}`;
    return;
  }

  if (node.type === "fact") {
    const f = node.raw;
    box.innerHTML = `
      <div class="dtitle">${escapeHtml(f.title || f.description.slice(0, 30))}</div>
      <div class="kv">${f.id} · ${escapeHtml(f.kind || "note")} · ${escapeHtml(f.creator || "")}</div>
      <div class="kv">${escapeHtml(f.description)}</div>
      ${kvRows(f.data)}
      ${f.source_intent ? `<div class="kv">来自 ${escapeHtml(f.source_intent)}</div>` : ""}
      <div class="mrow">
        <button class="act" id="d-intent">用它建意图</button>
      </div>`;
    const btn = $("#d-intent");
    if (btn) { btn.disabled = !writeMode; btn.onclick = () => openIntentForm(f.id); }
    return;
  }

  if (node.type === "intent") {
    const i = node.raw;
    const done = i.status === "done" || !!i.to;
    const confirmed = !!i.confirmed_at;
    box.innerHTML = `
      <div class="dtitle">${escapeHtml(i.title || i.description.slice(0, 30))}</div>
      <div class="kv">${i.id} · ${escapeHtml(i.status || "open")}${i.worker ? " · " + escapeHtml(i.worker) : ""}</div>
      <div class="kv">from ${(i.from || []).map(x => `<a href="#" data-id="${x}">${x}</a>`).join(", ")}</div>
      ${i.to ? `<div class="kv">→ ${escapeHtml(i.to)}</div>` : ""}
      <div class="kv">${escapeHtml(i.description)}</div>
      <div class="mrow">
        ${done ? "" : `<button class="act" id="d-claim">认领</button>
        <button class="act" id="d-release">释放</button>
        <button class="act pri" id="d-dispatch">派发执行</button>
        <button class="act" id="d-done">完成…</button>`}
        ${!done && i.requires_confirmation && !confirmed
          ? `<button class="act" id="d-confirm">批准</button>` : ""}
        ${!done && i.requires_confirmation && confirmed
          ? `<span class="kv" style="align-self:center">已批准 ${escapeHtml((i.confirmed_at || "").slice(11,19))}</span>` : ""}
        ${done ? `<span class="kv">已完成</span>` : ""}
        <button class="act" id="d-stop" style="display:none">停止</button>
      </div>
      <pre id="runlog"></pre>`;

    box.querySelectorAll("a[data-id]").forEach(a => a.onclick = ev => {
      ev.preventDefault();
      const t = nodeById(a.dataset.id); if (t) selectNode(t);
    });

    const wrap = fn => async () => {
      try { await fn(); await loadGraph(); renderDetail(true); }
      catch (e) { alert(e.message); }
    };
    if ($("#d-claim")) $("#d-claim").onclick = wrap(async () => {
      await postJSON(`/api/ops/claim/${i.id}`, {worker: "web"});
    });
    if ($("#d-release")) $("#d-release").onclick = wrap(async () => {
      await postJSON(`/api/ops/release/${i.id}`, {worker: "web"});
    });
    if ($("#d-confirm")) $("#d-confirm").onclick = wrap(async () => {
      await postJSON(`/api/confirm/${i.id}`, {});
    });
    if ($("#d-done")) $("#d-done").onclick = () => openDoneForm(i.id);
    if ($("#d-dispatch")) $("#d-dispatch").onclick = () => dispatchIntent(i.id);
    if (!writeMode) box.querySelectorAll(".act").forEach(b => b.disabled = true);
    return;
  }
}

async function openFactForm(kind) {
  const box = $("#detail");
  box.innerHTML = `
    <div class="dtitle">新建事实</div>
    <div class="form">
      <label>标题</label><input id="f-title" placeholder="例如 10.0.0.5:8080 Tomcat 9.0.31">
      <label>类型</label>
      <select id="f-kind">${["host","service","vuln","cred","loot","flag","note"]
        .map(k => `<option ${k === (kind || "note") ? "selected" : ""}>${k}</option>`).join("")}</select>
      <label>描述（必填）</label><textarea id="f-desc" placeholder="怎么确认的、看到了什么"></textarea>
      <label>data（每行 key=value，可选）</label>
      <textarea id="f-data" placeholder="host=10.0.0.5&#10;port=8080"></textarea>
      <div class="mrow"><button class="act pri" id="f-save">保存</button>
      <button class="act" id="f-cancel">取消</button></div>
    </div>`;
  $("#f-cancel").onclick = () => { selectedId = null; renderDetail(true); };
  $("#f-save").onclick = async () => {
    const data = {};
    ($("#f-data").value || "").split("\n").forEach(line => {
      const m = line.match(/^\s*([A-Za-z0-9_.-]+)\s*=\s*(.*)$/);
      if (m) data[m[1]] = m[2];
    });
    try {
      const d = await postJSON("/api/ops/fact", {
        title: $("#f-title").value, description: $("#f-desc").value,
        kind: $("#f-kind").value, data,
      });
      selectedId = d.fact.id;
      await loadGraph(); renderDetail(true);
    } catch (e) { alert("创建失败: " + e.message); }
  };
}

function openIntentForm(prefillFrom) {
  const box = $("#detail");
  const facts = (graphData.facts || []);
  box.innerHTML = `
    <div class="dtitle">新建意图</div>
    <div class="form">
      <label>标题</label><input id="i-title" placeholder="例如 对 8080 做 AJP 探测">
      <label>描述（必填）</label><textarea id="i-desc" placeholder="具体做什么、预期证据、时间盒"></textarea>
      <label>来源 fact（至少一个）</label>
      <div id="from-box">
        ${facts.map(f => `<label>
          <input type="checkbox" value="${f.id}" ${f.id === prefillFrom ? "checked" : ""}>
          ${f.id} ${escapeHtml(f.title || f.description.slice(0, 20))}</label>`).join("") || "（先创建 fact）"}
      </div>
      <label><input type="checkbox" id="i-confirm"> 需要人工批准后才能执行</label>
      <div class="mrow"><button class="act pri" id="i-save">保存</button>
      <button class="act" id="i-cancel">取消</button></div>
    </div>`;
  $("#i-cancel").onclick = () => renderDetail(true);
  $("#i-save").onclick = async () => {
    const from = [...box.querySelectorAll("#from-box input:checked")].map(x => x.value);
    try {
      const d = await postJSON("/api/ops/intent", {
        title: $("#i-title").value, description: $("#i-desc").value,
        from, requires_confirmation: $("#i-confirm").checked,
      });
      selectedId = d.intent.id;

function openDoneForm(iid) {
  const box = $("#detail");
  box.innerHTML = `
    <div class="dtitle">完成 ${iid}（同时写入产出事实）</div>
    <div class="form">
      <label>产出了什么（必填）</label><textarea id="d-desc" placeholder="证据：读了 /WEB-INF/web.xml，返回 200 与 XML 内容"></textarea>
      <label>事实类型</label>
      <select id="d-kind">${["vuln","service","cred","loot","host","note"]
        .map(k => `<option>${k}</option>`).join("")}</select>
      <label>data（每行 key=value，可选）</label><textarea id="d-data" placeholder="cve=CVE-2020-1938"></textarea>
      <div class="mrow"><button class="act pri" id="dd-save">完成并记录</button>
      <button class="act" id="dd-cancel">取消</button></div>
    </div>`;
  $("#dd-cancel").onclick = () => renderDetail(true);
  $("#dd-save").onclick = async () => {
    const data = {};
    ($("#d-data").value || "").split("\n").forEach(line => {
      const m = line.match(/^\s*([A-Za-z0-9_.-]+)\s*=\s*(.*)$/);
      if (m) data[m[1]] = m[2];
    });
    try {
      await postJSON(`/api/ops/done/${iid}`, {
        description: $("#d-desc").value, kind: $("#d-kind").value,
        data, worker: "web",
      });
      await loadGraph(); renderDetail(true);
    } catch (e) { alert("失败: " + e.message); }

}

async function dispatchIntent(iid) {
  const log = $("#runlog");
  try {
    const d = await postJSON(`/api/ops/dispatch/${iid}`, {skip_permissions: true});
    if (log) { log.style.display = "block"; log.textContent = `started pid ${d.pid}\n`; }
    if ($("#d-stop")) {
      $("#d-stop").style.display = "";
      $("#d-stop").textContent = "停止";
      $("#d-stop").onclick = async () => {
        try { await postJSON(`/api/ops/dispatch_stop/${iid}`, {}); } catch (e) { alert(e.message); }
      };
    }
    pollRun(iid);
  } catch (e) { alert("派发失败: " + e.message); }
}

function pollRun(iid) {
  if (runTimer) clearTimeout(runTimer);
  const tick = async () => {
    try {
      const r = await fetch(`/api/ops/dispatch/${iid}`);
      const d = await r.json();
      const log = $("#runlog");
      if (log && d.tail) { log.style.display = "block"; log.textContent = d.tail; log.scrollTop = log.scrollHeight; }
      if (d.running) { runTimer = setTimeout(tick, 1500); return; }
      if ($("#d-stop")) $("#d-stop").style.display = "none";
      if (selectedId === iid) await loadGraph();
    } catch (e) { runTimer = setTimeout(tick, 3000); }
  };
  runTimer = setTimeout(tick, 800);
}

// ------------------------------------------------------------------ //
// search
// ------------------------------------------------------------------ //
let searchTimer = null;
function wireSearch() {
  const input = $("#q"), box = $("#results");
  input.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 2) { box.style.display = "none"; return; }
    searchTimer = setTimeout(() => runSearch(q), 280);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Escape") { box.style.display = "none"; input.blur(); }
  });
  document.addEventListener("click", e => {
    if (!box.contains(e.target) && e.target !== input) box.style.display = "none";
  });
}

async function runSearch(q) {
  const box = $("#results");
  box.innerHTML = `<div class="grp">搜索中…</div>`;
  box.style.display = "block";
  let d;
  try { d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=8`)).json(); }
  catch (e) { box.innerHTML = `<div class="grp">搜索失败</div>`; return; }

  const groups = [
    ["facts", "事实", x => `${x.id} · ${x.kind || "note"} · ${x.title || (x.description || "").slice(0, 24)}`],
    ["intents", "意图", x => `${x.id} · ${x.status} · ${x.title || (x.description || "").slice(0, 24)}`],
    ["assets", "资产", x => `${x.key} · ×${x.seen}`],
    ["traffic", "流量", x => `${x.status} ${x.method} ${x.host || ""}${x.path}`],
  ];
  let html = "";
  groups.forEach(([key, label, fmt]) => {
    const rows = d[key] || [];
    if (!rows.length) return;
    html += `<div class="grp">${label} ${rows.length}</div>`;
    rows.forEach(x => {
      const id = key === "facts" || key === "intents" ? x.id : (key === "assets" ? x.key : "t" + x.id);
      html += `<div class="it" data-kind="${key}" data-id="${escapeHtml(id)}">
        <span class="id">${escapeHtml(id)}</span>${escapeHtml(fmt(x))}</div>`;
    });
  });
  box.innerHTML = html || `<div class="grp">没有匹配「${escapeHtml(q)}」</div>`;

  box.querySelectorAll(".it").forEach(el => el.onclick = () => {
    const kind = el.dataset.kind, id = el.dataset.id;
    box.style.display = "none";
    if (kind === "traffic") { setMode("traffic"); showTraffic(id.slice(1)); return; }
    if (kind === "assets") {
      const rec = (d.assets || []).find(a => a.key === id);
      if (rec) {
        if (mode !== "graph") setMode("graph");
        window.__pseudo = window.__pseudo || {};
        window.__pseudo[id] = {id, label: rec.value, data: rec.data};
        selectedId = id; renderDetail(true);
      }
      return;
    }
    if (mode !== "graph") setMode("graph");
    const n = nodeById(id);
    if (n) selectNode(n);
  });
}

async function loadGraph() {
  try {
    const r = await fetch("/api/graph");
    build(await r.json());
  } catch (e) { console.error("graph:", e); }
}

async function loadAssets() {
  try {
    const r = await fetch("/api/assets");
    buildAssets(await r.json());
  } catch (e) { console.error("assets:", e); }
}

async function loadTraffic() {
  try {
    const r = await fetch("/api/traffic?limit=200");
    renderTraffic(await r.json());
  } catch (e) { console.error("traffic:", e); }
}

function renderTraffic(d) {
  const tb = document.querySelector("#ttable tbody");
  tb.innerHTML = "";
  const stats = d.stats || {total:0, hosts:0};
  const ts = v => (v ? String(v).slice(11, 19) : "-");
  document.querySelector("#tstats").textContent = d.available === false
    ? "还没有流量记录。抓包: mitmdump -s tools/mitm_sapper.py --set sapper_store=<项目目录>"
    : `${stats.total} 条 · ${stats.hosts} 个主机 · ${ts(stats.first)} → ${ts(stats.last)}`;
  document.querySelector("#s1").innerHTML = `traffic <b>${stats.total || 0}</b>`;
  document.querySelector("#s2").innerHTML = `hosts <b>${stats.hosts || 0}</b>`;
  document.querySelector("#s3").innerHTML =
    `codes <b>${Object.keys(stats.by_status || {}).length}</b>`;
  document.querySelector("#s4").innerHTML = `最近 <b>${ts(stats.last)}</b>`;
  if (d.available === false) return;
  (d.rows || []).forEach(r => {
    const tr = document.createElement("tr");
    const cls = r.status ? "s" + String(r.status)[0] : "";
    tr.innerHTML = `<td class="${cls}">${r.status ?? "-"}</td><td>${r.method}</td>
      <td>${escapeHtml((r.host || "") + r.path)}</td>
      <td>${r.resp_size ?? ""}</td>
      <td>${(r.tags || []).join(",")}</td>`;
    tr.onclick = () => showTraffic(r.id);
    tb.appendChild(tr);
  });
}

async function showTraffic(id) {
  const box = document.querySelector("#tdetail");
  try {
    const r = await fetch(`/api/traffic/${id}`);
    const d = await r.json();
    box.style.display = "block";
    box.textContent = `#${d.id}  ${d.method} ${d.url}  -> ${d.status}\n\n`
      + `--- request ---\n${d.req_headers || ""}\n\n${d.req_body || ""}\n\n`
      + `--- response ---\n${d.resp_headers || ""}\n\n${d.resp_body || ""}`;
  } catch (e) { box.textContent = "加载失败: " + e; }
}

function setMode(next, updateHash) {
  if (mode === next) return;
  mode = next;
  if (updateHash !== false) {
    try { history.replaceState(null, "", "#" + next); } catch (e) { /* file:// */ }
  }
  document.querySelectorAll("nav.tabs button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === next));
  const isTraffic = next === "traffic";
  document.querySelector("#traffic").style.display = isTraffic ? "block" : "none";
  document.querySelector("#svg").style.display = isTraffic ? "none" : "block";
  document.querySelector("#legend").style.display = isTraffic ? "none" : "block";
  document.querySelector("#tip").style.display = "none";
  document.querySelector("#empty").textContent = "等待数据…";
  if (next === "assets") loadAssets();
  else if (next === "traffic") loadTraffic();
  else { document.querySelector("#empty").style.display = nodes.length ? "none" : "flex"; loadGraph(); }
}

document.querySelectorAll("nav.tabs button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));

async function poll() {
  if (mode === "assets" || mode === "traffic") {
    assetTimer = (assetTimer + 1) % 3;
    if (assetTimer === 0) {
      if (mode === "assets") await loadAssets(); else await loadTraffic();
    }
  } else {
    try {
      const r = await fetch(`/api/events?since=${lastSeq}`);
      const d = await r.json();
      if (d.events && d.events.length) {
        pushEvents(d.events);
        lastSeq = d.last;
        setSeq(lastSeq);
        await loadGraph();
      } else if (d.last) { setSeq(d.last); }
    } catch (e) { /* server restarting */ }
  }
  setTimeout(poll, 2000);
}

initGraph();
d3.select("#svg").on("click", () => { if (selectedId) clearSelection(); });
wireSearch();
$("#btn-fact").onclick = () => openFactForm();
$("#btn-intent").onclick = () => {
  if (!(graphData.facts || []).length) { alert("先创建一个 fact，意图必须挂在事实上"); return; }
  openIntentForm();
};
$("#btn-refresh").onclick = () => {
  if (mode === "traffic") loadTraffic(); else if (mode === "assets") loadAssets(); else loadGraph();
};

async function initHealth() {
  try {
    const d = await (await fetch("/api/health")).json();
    writeMode = !!d.write;
    const badge = $("#wmode");
    badge.className = writeMode ? "" : "ro";
    badge.innerHTML = writeMode
      ? "可写 · <b>fact / intent / 认领 / 完成 / 派发</b>"
      : "只读 · 加 --allow-write 启动才能操作";
    $("#btn-fact").disabled = !writeMode;
    $("#btn-intent").disabled = !writeMode;
  } catch (e) { /* server starting */ }
}

const initial = (location.hash || "").replace("#", "");
function applyHash() {
  const raw = (location.hash || "").replace("#", "");
  if (!raw) return;
  const [m, id] = raw.split("/");
  if (m && m !== mode) setMode(m, false);
  if (id) { const n = nodeById(id); if (n) selectNode(n); }
}
initHealth().then(() => loadGraph()).then(() => {
  if (initial && initial !== "graph") setMode(initial.split("/")[0], false);
  applyHash();
  renderDetail(true);
  setTimeout(poll, 1500);
});
window.addEventListener("hashchange", applyHash);
window.addEventListener("resize", () => { if (sim) sim.force("center",
  d3.forceCenter(svg.node().clientWidth/2, svg.node().clientHeight/2)).alpha(.3).restart(); });
</script>
